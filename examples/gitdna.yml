# Keeps a GitDNA image genuinely fresh in a GitHub profile README.
#
# Why this exists: GitHub proxies README images through Camo, which caches them
# for hours. Embedding the live endpoint directly works, but updates lag. This
# workflow fetches the SVG on a schedule and commits it into the repo, so the
# README points at a file that actually changes.
#
# Install: copy to .github/workflows/gitdna.yml in your PROFILE repo (the one
# named the same as your username), set GITDNA_HOST below, then reference it:
#
#     ![GitDNA](./gitdna.svg)

name: GitDNA

on:
  schedule:
    - cron: "17 4 * * *" # daily, off the hour to dodge peak scheduling delays
  workflow_dispatch: # lets you trigger it by hand to test

permissions:
  contents: write

jobs:
  grow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the current organism
        env:
          GITDNA_HOST: https://your-app.example.com
        run: |
          curl --fail --silent --show-error --max-time 120 \
            "$GITDNA_HOST/svg/${{ github.repository_owner }}?style=forest&theme=dark" \
            -o gitdna.svg
          # Fail loudly rather than committing an error card or a truncated file.
          head -c 5 gitdna.svg | grep -q '<svg' || { echo "not an SVG"; exit 1; }

      - name: Commit if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gitdna.svg
          git diff --staged --quiet || git commit -m "gitdna: grow"
          git push
